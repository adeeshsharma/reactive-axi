packages:
  - "packages/*"
  - "fixtures/*"
onlyBuiltDependencies:
  - esbuild
allowBuilds:
  # core-js/core-js-pure (transitive polyfill deps, likely via CRA's babel toolchain) and
  # unrs-resolver (a native ESLint import-resolver optimization) all work fine today without
  # their postinstall scripts running - confirmed by the full check pipeline passing without
  # them. Explicitly false, not left as an unresolved prompt, so this never blocks pnpm's
  # automatic deps-sync check in a non-interactive environment like CI.
  core-js: false
  core-js-pure: false
  esbuild: true
  unrs-resolver: false
  # vue-demi's postinstall just detects which vue major version is present to pick an internal
  # shim - reka-ui's transitive dep, harmless to skip (same reasoning as core-js/unrs-resolver
  # above), and required here so this never blocks pnpm's automatic deps-sync check.
  vue-demi: false
